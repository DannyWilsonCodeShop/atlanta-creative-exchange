AWSTemplateFormatVersion: '2010-09-09'
Description: ACE Quote System — API Gateway + Step Functions + DynamoDB + SES + Bedrock (no Lambda)

Parameters:
  OwnerEmail:
    Type: String
    Default: wilson.danny@me.com

Resources:

  # === DynamoDB Table ===
  QuotesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ACE-Quotes
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: quoteId
          AttributeType: S
      KeySchema:
        - AttributeName: quoteId
          KeyType: HASH

  # === Step Functions Execution Role ===
  StepFunctionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ACE-StepFunctionsRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ACE-StepFunctionsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: !GetAtt QuotesTable.Arn
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: '*'
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: '*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

  # === Step Functions State Machine (Express) ===
  QuoteStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: ACE-QuoteProcessor
      StateMachineType: EXPRESS
      RoleArn: !GetAtt StepFunctionsRole.Arn
      DefinitionS3Location:
        Bucket: !Sub ace-deploy-${AWS::AccountId}
        Key: step-functions-definition.json
      Tags:
        - Key: Project
          Value: AtlantaCreativeExchange

  # === API Gateway HTTP API ===
  QuoteApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: ACE-QuoteAPI
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type

  # === API Gateway Role to invoke Step Functions ===
  ApiGatewayRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ACE-ApiGatewayRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeStepFunctions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - states:StartSyncExecution
                Resource: !GetAtt QuoteStateMachine.Arn

  # === API Gateway Integration (Step Functions) ===
  QuoteIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref QuoteApi
      IntegrationType: AWS_PROXY
      IntegrationSubtype: StepFunctions-StartSyncExecution
      CredentialsArn: !GetAtt ApiGatewayRole.Arn
      PayloadFormatVersion: '1.0'
      RequestParameters:
        StateMachineArn: !GetAtt QuoteStateMachine.Arn
        Input: $request.body

  # === API Gateway Route ===
  QuoteRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref QuoteApi
      RouteKey: POST /quote
      Target: !Sub integrations/${QuoteIntegration}

  # === API Gateway Stage ===
  QuoteStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref QuoteApi
      StageName: $default
      AutoDeploy: true

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !GetAtt QuoteApi.ApiEndpoint

  StateMachineArn:
    Description: Step Functions state machine ARN
    Value: !GetAtt QuoteStateMachine.Arn

  TableName:
    Description: DynamoDB table name
    Value: !Ref QuotesTable
